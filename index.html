<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Listening Room - Music Panel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #050508;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(76, 29, 149, 0.35) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(30, 58, 138, 0.35) 0%, transparent 40%);
            color: #f3f4f6;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dashboard-container {
            width: 92%;
            height: 88%;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            grid-template-rows: 1fr auto;
            gap: 24px;
            padding: 10px;
        }

        /* Glassmorphism Common Style */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        }

        /* Left Side: Media Player */
        .player-section {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .player-section::before {
            content: '';
            position: absolute;
            top: -50px;
            left: -50px;
            width: 200px;
            height: 200px;
            background: rgba(168, 85, 247, 0.2);
            filter: blur(60px);
            border-radius: 50%;
            z-index: 0;
        }

        .album-info-container {
            display: flex;
            gap: 20px;
            align-items: center;
            z-index: 1;
        }

        .album-art {
            width: 110px;
            height: 110px;
            border-radius: 18px;
            background: linear-gradient(135deg, #3b82f6, #9333ea);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
        }

        .track-details h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 6px;
            letter-spacing: -0.01em;
        }

        .track-details p {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 400;
        }

        .player-controls-area {
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            position: relative;
            cursor: pointer;
        }

        .progress-fill {
            width: 45%;
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #ec4899);
            border-radius: 2px;
        }

        .time-indicators {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
        }

        .buttons-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 28px;
        }

        .btn-control {
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            opacity: 0.8;
            transition: opacity 0.2s, transform 0.2s;
        }

        .btn-control:hover {
            opacity: 1;
            transform: scale(1.05);
        }

        .btn-play {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        /* Right Side: Lyrics & Toggle */
        .right-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .lyrics-section {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .lyrics-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .lyrics-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 500;
        }

        .btn-toggle-lyrics {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.8);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-toggle-lyrics:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .lyrics-content {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.9rem;
            line-height: 1.6;
            font-weight: 400;
            transition: opacity 0.3s ease;
        }

        .lyrics-content .active-line {
            color: #ffffff;
            font-weight: 500;
        }

        /* Bottom Row / Status */
        .status-bar {
            grid-column: span 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.4);
        }

        .weather-widget {
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        
        <!-- צד שמאל: נגן המוזיקה -->
        <div class="glass-panel player-section">
            <div class="album-info-container">
                <div class="album-art"></div>
                <div class="track-details">
                    <h2 id="track-name">שם השיר</h2>
                    <p id="artist-name">שם האמן</p>
                </div>
            </div>

            <div class="player-controls-area">
                <div>
                    <div class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>
                    <div class="time-indicators">
                        <span id="current-time">1:12</span>
                        <span id="total-time">3:45</span>
                    </div>
                </div>

                <div class="buttons-row">
                    <button class="btn-control">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="4" x2="5" y2="20"></line></svg>
                    </button>
                    <button class="btn-control btn-play" id="play-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                    </button>
                    <button class="btn-control">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="4" x2="19" y2="20"></line></svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- צד ימין: מילים לשירים עם אפשרות סגירה -->
        <div class="right-column">
            <div class="glass-panel lyrics-section">
                <div class="lyrics-header">
                    <span class="lyrics-title">מילים לשיר</span>
                    <button class="btn-toggle-lyrics" id="toggleLyricsBtn" onclick="toggleLyrics()">הסתר מילים</button>
                </div>
                <div class="lyrics-content" id="lyricsText">
                    <p>השורה הראשונה של השיר מתנגנת ברקע...</p>
                    <p class="active-line">השורה הנוכחית המרכזית שמוצגת כרגע</p>
                    <p>השורה הבאה שתגיע מיד לאחר מכן...</p>
                    <p>עוד שורה מעודנת ונייחת לאורכה של המוזיקה</p>
                </div>
            </div>
        </div>

        <!-- שורה תחתונה: מזג אוויר וסטטוס -->
        <div class="status-bar">
            <div class="weather-widget">
                <span>☁️ 18°C, מעונן חלקית</span>
            </div>
            <div class="system-status">
                <span>⚡ מחובר לחשמל • iPad Active</span>
            </div>
        </div>

    </div>

    <script>
        // פונקציה להסתרת/הצגת אזור המילים בלחיצה
        function toggleLyrics() {
            const lyricsContent = document.getElementById('lyricsText');
            const btn = document.getElementById('toggleLyricsBtn');
            if (lyricsContent.style.display === 'none') {
                lyricsContent.style.display = 'block';
                btn.innerText = 'הסתר מילים';
            } else {
                lyricsContent.style.display = 'none';
                btn.innerText = 'הצג מילים';
            }
        }
    </script>
</body>
</html>
