<!DOCTYPE html>
<html lang="he" dir="ltr">
<head>
<meta charset="utf-8">
<title>Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Panel">
<style>
:root{--fg:#fff;--dim:rgba(255,255,255,.5);--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--c1:#7b3fe4;--c2:#2d6cff;--c3:#ff4f9a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;margin:0;background:#000;color:var(--fg);overflow:hidden;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif}
.blob{position:absolute;border-radius:50%;opacity:.34;filter:none;-webkit-filter:none;transition:opacity 1.2s ease;will-change:opacity;animation:none!important;-webkit-animation:none!important;pointer-events:none}
#b1{width:70vw;height:70vw;left:-15vw;top:-20vw;background:radial-gradient(ellipse at center,var(--c1) 0%,transparent 72%)}
#b2{width:65vw;height:65vw;right:-20vw;top:5vw;background:radial-gradient(ellipse at center,var(--c2) 0%,transparent 72%);animation-delay:-8s}
#b3{width:60vw;height:60vw;left:20vw;bottom:-30vw;background:radial-gradient(ellipse at center,var(--c3) 0%,transparent 72%);animation-delay:-16s}
@-webkit-keyframes drift{to{-webkit-transform:translate(8vw,6vw) scale(1.15)}}
@keyframes drift{to{transform:translate(8vw,6vw) scale(1.15)}}
#app{position:absolute;inset:0;padding:26px 34px 84px;display:flex;flex-direction:column;opacity:1;transition:opacity 1.8s ease;will-change:opacity}
body.idle #app,body.idle #tabs,body.idle #sleepBtn,body.idle #cfg{opacity:0;pointer-events:none;transition:opacity 1.2s ease}
.glass{background:rgba(24,24,30,.88);border:1px solid var(--line)}
#top{display:flex;justify-content:space-between;align-items:flex-start}
#clock{font-size:64px;font-weight:200;line-height:1;letter-spacing:1px}
#date{font-size:15px;color:var(--dim);margin-top:6px}
#pill{padding:9px 18px;border-radius:30px;font-size:16px;margin-top:6px}
#remind{text-align:center;font-size:15px;color:var(--dim);height:20px;opacity:0;transition:opacity 1.5s}
#main{flex:1;display:flex;align-items:center;min-height:0}
#left{width:45%;display:flex;flex-direction:column;align-items:center}
.art{width:min(290px,28vw);height:min(290px,28vw);min-width:220px;min-height:220px;border-radius:22px;background:linear-gradient(135deg,#ff8a5c,#7b3fe4 55%,#1b2a6b);background-size:cover;background-position:center center;background-repeat:no-repeat;
box-shadow:0 16px 34px rgba(0,0,0,.48),0 0 34px -14px var(--c1)}
.title{font-size:clamp(25px,2.5vw,31px);font-weight:650;margin-top:22px;text-align:center;max-width:95%;}
.sub{font-size:clamp(16px,1.6vw,19px);color:var(--dim);margin-top:5px;text-align:center;max-width:95%;}
.eq{display:flex;align-items:flex-end;height:18px;margin-top:12px}
.eq i{width:3px;margin:0 2px;border-radius:2px;background:#fff;height:4px;-webkit-animation:eq 1s ease-in-out infinite;animation:eq 1s ease-in-out infinite;-webkit-animation-play-state:paused;animation-play-state:paused}
.playing .eq i{-webkit-animation-play-state:running;animation-play-state:running}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}.eq i:nth-child(4){animation-delay:-.15s}.eq i:nth-child(5){animation-delay:-.75s}
@-webkit-keyframes eq{50%{height:18px}}@keyframes eq{50%{height:18px}}
#right{flex:1;height:100%;max-height:330px;overflow:hidden;position:relative;
-webkit-mask-image:linear-gradient(transparent,#000 25%,#000 75%,transparent);mask-image:linear-gradient(transparent,#000 25%,#000 75%,transparent)}
#lyrics{position:absolute;left:0;right:0;transition:-webkit-transform .8s ease,transform .8s ease}
#lyrics div{font-size:clamp(28px,2.7vw,34px);font-weight:600;padding:11px 12px;color:rgba(255,255,255,.28);transition:color .22s ease;direction:ltr}
#lyrics div.on{color:#fff;text-shadow:0 0 22px rgba(255,255,255,.45)}
#prog{display:flex;align-items:center;direction:ltr}#prog .eq{display:none!important}
#prog span{font-size:12px;color:var(--dim);width:42px;text-align:center}
#track{flex:1;height:22px;display:flex;align-items:center}
#rail{flex:1;height:3px;background:rgba(255,255,255,.15);border-radius:3px}
#fill{height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,#5ee7ff,var(--c1),var(--c3));box-shadow:0 0 8px var(--c1);transition:width 1s linear}
#ctl{display:flex;justify-content:center;margin-top:8px}
#ctl button,.tab{color:#fff;font-family:inherit;border:1px solid var(--line);cursor:pointer}
#ctl button{width:46px;height:46px;border-radius:50%;margin:0 12px;padding:0;background:rgba(35,35,42,.9)}
#ctl button.m{width:54px;height:54px}
svg{width:18px;height:18px;fill:#fff;vertical-align:middle}
#tabs{position:absolute;bottom:20px;left:50%;-webkit-transform:translateX(-50%);transform:translateX(-50%);display:flex;padding:5px;border-radius:30px;transition:opacity 1.2s}
#quickVol{position:fixed;left:calc(50% + 145px);bottom:27px;z-index:7;display:flex;align-items:center;gap:8px;width:170px;padding:10px 12px;border-radius:24px;background:rgba(24,24,30,.78);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#quickVol .speaker{font-size:16px;line-height:1;opacity:.9}#quickVol input{width:100%;min-width:0;flex:1}
@media(max-width:700px){#quickVol{left:calc(50% + 112px);width:calc(50vw - 126px);min-width:78px;padding:9px 8px;gap:5px;bottom:25px}#quickVol .speaker{font-size:14px}}
.tab{background:transparent;border:0;border-radius:24px;padding:9px 22px;font-size:17px}
.tab.on{background:rgba(255,255,255,.18)}
.sheet{position:absolute;left:50%;bottom:78px;width:420px;margin-left:-210px;max-height:62%;padding:20px;border-radius:26px;background:rgba(20,20,28,.55);display:none;flex-direction:column;z-index:5}
.sheet.show{display:flex}
.sheet h3{margin:0 0 8px;font-size:13px;font-weight:500;color:var(--dim)}
#list{overflow:auto;-webkit-overflow-scrolling:touch}
.t{display:flex;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);font-size:18px}
.t span{flex:1;direction:auto;text-align:start}.t.done span{text-decoration:line-through;color:var(--dim)}
.t b{font-weight:300;color:var(--dim);padding:0 8px;font-size:22px}
#addRow{display:flex;margin-top:10px}
#inp{flex:1;background:rgba(255,255,255,.1);border:0;border-radius:14px;padding:11px 14px;color:#fff;font-size:16px;font-family:inherit;-webkit-user-select:text;user-select:text;margin-right:8px;direction:auto}
#add,#pwr{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:14px;font-size:20px;padding:0 16px}
.lamp{display:flex;align-items:center;margin-top:12px;font-size:14px}.lamp label{width:70px;direction:rtl}.lamp input{flex:1}
#pwr{height:42px;margin-top:4px}#pwr.on{background:#fff;color:#000}
#idle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 1.8s ease;padding:24px;text-align:center;z-index:2;background:rgba(0,0,0,.08)}
body.idle #idle{opacity:1;pointer-events:auto;transition:opacity 1.8s ease}
#idle .idle-clock{font-size:clamp(42px,8vw,72px);font-weight:200;line-height:1;letter-spacing:1px;margin-bottom:24px;color:rgba(255,255,255,.92);font-variant-numeric:tabular-nums}#idle .art{width:min(310px,54vw);height:min(310px,54vw);flex-shrink:0;border-radius:24px;box-shadow:0 20px 70px rgba(0,0,0,.5),0 0 90px -18px var(--c1)}#idle .title{max-width:90vw;font-size:clamp(24px,4vw,34px);margin-top:22px}#idle .sub{max-width:90vw;font-size:18px}#idle #iLy{font-size:21px;margin-top:18px;color:rgba(255,255,255,.8);min-height:28px;text-align:center;direction:ltr}
#night{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:9}
#nclock{font-size:48px;font-weight:200;color:rgba(255,255,255,.22)}

#lyrics div{-webkit-transform:none;transform:none;transition:color .22s ease}
#lyrics div.on{-webkit-transform:none;transform:none}
.pl{flex:1;border:0;border-radius:14px;padding:12px 6px;margin:0 4px;background:rgba(255,255,255,.12);color:#fff;font-size:16px;font-family:inherit}.pl.on{background:#fff;color:#000}
.dev{display:block;width:100%;text-align:start;border:0;border-radius:14px;padding:12px 14px;margin:5px 0;font-size:16px;font-family:inherit;background:rgba(255,255,255,.1);color:#fff}.dev.on{background:#fff;color:#000}
#vol{-webkit-appearance:none;appearance:none;height:10px;border-radius:5px;background:rgba(255,255,255,.22);outline:0}#vol::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:#fff}
#cfg{position:fixed;bottom:14px;right:14px;width:40px;height:40px;border:0;border-radius:50%;background:transparent;color:#fff;opacity:.2;font-size:20px;z-index:6}
#nv{position:fixed;width:2px;height:2px;opacity:.02;pointer-events:none;top:0;left:0}
#setup{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;display:none;align-items:center;justify-content:center;padding:6vw;z-index:20;overflow:auto;-webkit-user-select:text}
#setup .box{max-width:620px;width:100%}#setup h1{font-size:28px;margin:0 0 10px}#setup p{color:rgba(255,255,255,.6);font-size:17px;margin:8px 0}
#setup code{display:block;background:#1c1c1e;padding:12px;border-radius:10px;color:#fa586a;word-break:break-all;margin:6px 0;-webkit-user-select:text;user-select:text}
#setup input,#setup textarea{width:100%;font-size:18px;padding:14px;border-radius:12px;border:0;background:#1c1c1e;color:#fff;margin:6px 0 12px;word-break:break-all;-webkit-user-select:text;user-select:text}
#setup textarea{height:90px;font-size:15px}#setup button{font-size:17px;font-weight:700;padding:13px 24px;border:0;border-radius:12px;background:#2c2c2e;color:#fff;margin-bottom:8px}#go{background:#fa586a!important}
#err{color:#ff8a7a;margin:8px 0}#setup hr{border:0;border-top:1px solid #2c2c2e;margin:22px 0}
html.ov #app,html.ov #idle,html.ov #tabs,html.ov .blob,html.ov .sheet,html.ov #cfg{visibility:hidden!important}
.sheet{left:auto;right:34px;margin-left:0;width:340px;max-height:56%}
html,body{overscroll-behavior:none}body{position:fixed;top:0;left:0;width:100%;height:100%}

/* שדרוגים: מצב שינה ידני, חלונית משימות נפרדת ותוכן גדול יותר */
#sleepBtn{position:fixed;left:18px;bottom:16px;z-index:7;width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(22,22,30,.72);color:#fff;font-size:25px;box-shadow:0 8px 26px rgba(0,0,0,.22);transition:opacity 1.2s ease,background .2s}
#sleepBtn:active{background:rgba(255,255,255,.22)}
/* Dynamic-Island-style music indicator, deliberately separate from the seek timeline */
#musicIsland{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:6;display:flex;align-items:center;justify-content:center;gap:5px;width:74px;height:34px;padding:0 17px;border:1px solid rgba(255,255,255,.09);border-radius:22px;background:rgba(8,8,12,.78);box-shadow:0 5px 24px rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:opacity .25s ease}
body.track-playing #musicIsland{opacity:1}
#musicIsland i{display:block;width:3px;height:5px;border-radius:3px;background:#fff;transform-origin:center;animation:islandBeat .72s ease-in-out infinite;animation-play-state:paused}
body.track-playing #musicIsland i{animation-play-state:running}
#musicIsland i:nth-child(2){animation-delay:-.18s}
#musicIsland i:nth-child(3){animation-delay:-.42s}
#musicIsland i:nth-child(4){animation-delay:-.29s}
#musicIsland i:nth-child(5){animation-delay:-.55s}
@keyframes islandBeat{0%,100%{height:5px;opacity:.72}50%{height:19px;opacity:1}}
@media(max-width:700px){#musicIsland{top:10px;width:68px;height:30px}}
#idle{z-index:8;background:rgba(0,0,0,.22);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
#idle .idle-clock{margin-bottom:clamp(18px,3vh,30px)}
#idle #wakeBtn{position:absolute;left:20px;bottom:18px;border:1px solid rgba(255,255,255,.18);border-radius:50%;width:48px;height:48px;background:rgba(255,255,255,.1);color:#fff;font-size:23px}
#idle .sleep-track{display:none;flex-direction:column;align-items:center;max-width:94vw}
body.idle.track-playing #idle .sleep-track{display:flex}
body.idle.track-playing #idle .idle-empty{display:none}
#idle .idle-empty{font-size:13px;color:rgba(255,255,255,.28);margin-top:8px}
#idle .art{width:min(310px,46vh,54vw);height:min(310px,46vh,54vw)}
#idle #iLy{max-width:90vw;max-height:2.8em;overflow:hidden}
#sT.sheet{position:fixed;left:auto;right:22px;top:92px;bottom:auto;width:min(370px,calc(100vw - 36px));max-height:calc(100vh - 170px);z-index:10;border-radius:24px;background:rgba(20,20,28,.94);box-shadow:0 20px 70px rgba(0,0,0,.35)}
#sT #list{min-height:24px;max-height:calc(100vh - 270px)}
#sT h3{font-size:16px;color:rgba(255,255,255,.72)}
#sT #inp{min-width:0}
@media(max-width:700px){#app{padding:20px 18px 82px}#main{gap:12px}#left{width:46%}.art{width:min(260px,34vw);height:min(260px,34vw);min-width:0;min-height:0}.title{font-size:clamp(21px,3.4vw,27px)}.sub{font-size:clamp(14px,2vw,17px)}#lyrics div{font-size:clamp(23px,3.4vw,30px);padding:8px 6px}#sT.sheet{right:12px;top:76px;width:min(360px,calc(100vw - 24px))}#idle .art{width:min(250px,38vh,58vw);height:min(250px,38vh,58vw)}}
@media(max-height:600px){#idle .art{width:min(190px,34vh,42vw);height:min(190px,34vh,42vw)}#idle .idle-clock{margin-bottom:12px}#idle .title{margin-top:12px}#idle #iLy{margin-top:8px}}

</style>
</head>

<div id="setup"><div class="box"><h1>חיבור לספוטיפיי</h1><p>Redirect URI באפליקציית ספוטיפיי:</p><code id="ruri"></code><input id="cid" placeholder="Client ID" autocapitalize="off" autocorrect="off" spellcheck="false"><button id="go">התחברות</button><div id="err"></div><hr>
<h1>העברת חיבור בין מכשירים</h1><div id="outbox" style="display:none"><p>הקוד של המכשיר הזה:</p><textarea id="tcode" readonly></textarea><button id="copy">העתק קוד</button></div>
<p>יש קוד ממכשיר אחר? הדבק:</p><textarea id="tin" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea><button id="useCode">חבר עם הקוד</button> <button id="closeSetup">סגור</button></div></div>
<div id="night"><div id="nclock"></div></div>

<script>
var CONFIG={lat:32.08,lon:34.78,nightFrom:23,nightTo:6,reminderFrom:20,lampEndpoint:""};
function $(i){return document.getElementById(i)}
function p2(n){return (n<10?"0":"")+n}
var days=["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"],months=["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];

/* שעון, לילה, תזכורת */
var nightOv=0,nT;
function tick(){var d=new Date(),h=d.getHours(),t=p2(h)+":"+p2(d.getMinutes());
 $("clock").textContent=t;$("nclock").textContent=t;if($("idleClock"))$("idleClock").textContent=t;
 $("date").textContent="יום "+days[d.getDay()]+", "+d.getDate()+" ב"+months[d.getMonth()];
 /* אין מסך שעון אוטומטי בלילה — מצב השינה מופעל רק בלחיצה על הירח */
 $("night").style.display="none";ovl();if(window.pageYOffset)window.scrollTo(0,0);
 var r=$("remind");if(h>=CONFIG.reminderFrom&&!n){r.textContent="זמן לסדר את המשימות למחר";r.style.opacity=1}else r.style.opacity=0}
$("night").onclick=function(){ $("night").style.display="none"; ovl(); };
setInterval(tick,1000);tick();

/* מזג אוויר */
function feel(t){return t<=12?"קר":t<=19?"קריר":t<=26?"חמים":"חם"}
$("pill").textContent="18° · קריר";
function weather(){fetch("https://api.open-meteo.com/v1/forecast?latitude="+CONFIG.lat+"&longitude="+CONFIG.lon+"&current_weather=true")
 .then(function(r){return r.json()}).then(function(j){var t=Math.round(j.current_weather.temperature);$("pill").textContent=t+"° · "+feel(t)}).catch(function(){})}
weather();setInterval(weather,900000);

/* נגן ספוטיפיי */
var LY=[],cur=-1,S={id:null,playing:false,progress:0,stamp:0,duration:0,rep:"off",shuf:false,volT:0},box=$("lyrics");
var SCOPES="user-read-playback-state user-modify-playback-state user-read-currently-playing",REDIRECT=location.origin+location.pathname;
var LS={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}},del:function(k){try{localStorage.removeItem(k)}catch(e){}}};
function fmt(s){s=Math.floor(Math.max(0,s));return Math.floor(s/60)+":"+p2(s%60)}
var ICON_P='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',ICON_S='<svg viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>';
function pp(){$("pp").innerHTML=S.playing?ICON_S:ICON_P;document.body.classList.toggle("playing",!!S.playing)}
function setPal(p){var s=document.documentElement.style;s.setProperty("--c1",p[0]);s.setProperty("--c2",p[1]);s.setProperty("--c3",p[2]);}
function paletteFrom(url,cb){var im=new Image();im.crossOrigin="anonymous";im.onload=function(){try{var c=document.createElement("canvas");c.width=c.height=32;var x=c.getContext("2d",{willReadFrequently:true});var side=Math.min(im.naturalWidth||im.width,im.naturalHeight||im.height),sx=((im.naturalWidth||im.width)-side)/2,sy=((im.naturalHeight||im.height)-side)/2;x.drawImage(im,sx,sy,side,side,0,0,32,32);var d=x.getImageData(0,0,32,32).data,k={},i,r,g,b,m,n,s,key;
 for(i=0;i<d.length;i+=4){if(d[i+3]<180)continue;r=d[i];g=d[i+1];b=d[i+2];m=Math.max(r,g,b);n=Math.min(r,g,b);s=m?(m-n)/m:0;if(m<42||s<.22)continue;key=(r>>5)+","+(g>>5)+","+(b>>5);if(!k[key])k[key]={r:0,g:0,b:0,n:0,w:0};k[key].r+=r;k[key].g+=g;k[key].b+=b;k[key].n++;k[key].w+=s*(m/255)}
 var a=[];for(key in k)a.push(k[key]);a.sort(function(p,q){return q.w-p.w});var o=a.slice(0,3).map(function(e){return "rgb("+Math.round(e.r/e.n)+","+Math.round(e.g/e.n)+","+Math.round(e.b/e.n)+")"});while(o.length<3)o.push(o[0]||"#7b3fe4");cb(o)}catch(e){cb(["#7b3fe4","#2d6cff","#ff4f9a"])}};im.onerror=function(){cb(["#7b3fe4","#2d6cff","#ff4f9a"])};im.src=url}

function curMs(){return S.progress+(S.playing?Date.now()-S.stamp:0)}
function ui(){var ms=curMs();
 if(S.duration){$("fill").style.width=Math.min(100,ms/S.duration*100)+"%";$("cur").textContent=fmt(ms/1000);$("rem").textContent="-"+fmt((S.duration-ms)/1000)}
 if(LY.length){var i=-1,k,look=ms+350;for(k=0;k<LY.length;k++){if(LY[k].t<=look)i=k;else break}
  if(i!==cur){var c=box.children,h=$("right").clientHeight,old=cur;cur=i;if(old>=0&&c[old])c[old].className="";if(i>=0&&c[i]){var a=c[i],y=h/2-(a.offsetTop+a.offsetHeight/2);c[i].className="on";box.style.webkitTransform=box.style.transform="translateY("+y+"px)";$("iLy").textContent=LY[i].s}}}}
function parseLRC(txt){var out=[],re=/\[(\d+):(\d+(?:\.\d+)?)\]/g;
 txt.split("\n").forEach(function(line){var m,ts=[],last=0;re.lastIndex=0;while((m=re.exec(line))){ts.push(+m[1]*60000+ +m[2]*1000);last=re.lastIndex}
  var x=line.slice(last).trim();ts.forEach(function(t){out.push({t:t,s:x})})});out.sort(function(a,b){return a.t-b.t});return out}
function setLines(list,synced){LY=synced?list:[];box.innerHTML="";cur=-1;box.style.webkitTransform=box.style.transform="translateY(0)";$("iLy").textContent="";
 list.forEach(function(l){var s=synced?l.s:l,d=document.createElement("div");d.textContent=s||"\u266A";if(/[\u0590-\u05FF]/.test(s))d.style.direction="rtl";if(!synced)d.className="on";box.appendChild(d)})}
function loadLyrics(t){var id=t.id,q="track_name="+encodeURIComponent(t.name)+"&artist_name="+encodeURIComponent(t.artists[0].name)+"&album_name="+encodeURIComponent(t.album.name)+"&duration="+Math.round(t.duration_ms/1000),artist=t.artists[0].name,title=t.name;
 setLines([],true);
 function usable(d){return !!(d&&(d.syncedLyrics||d.plainLyrics))}
 function searchLR(query){return fetch("https://lrclib.net/api/search?"+query).then(function(r){return r.ok?r.json():[]}).then(function(a){for(var i=0;i<a.length;i++)if(a[i].syncedLyrics)return a[i];for(var j=0;j<a.length;j++)if(a[j].plainLyrics)return a[j];return null})}
 fetch("https://lrclib.net/api/get?"+q).then(function(r){return r.ok?r.json():null}).then(function(d){
  if(usable(d))return d;
  return searchLR("track_name="+encodeURIComponent(title)+"&artist_name="+encodeURIComponent(artist)).then(function(x){if(usable(x))return x;return searchLR("track_name="+encodeURIComponent(title))})
 }).then(function(d){
  if(id!==S.id)return;
  if(d&&d.syncedLyrics){setLines(parseLRC(d.syncedLyrics),true);return}
  if(d&&d.plainLyrics){setLines(d.plainLyrics.split("\n").filter(function(x){return x.trim()}),false);return}
  return fetch("https://api.lyrics.ovh/v1/"+encodeURIComponent(artist)+"/"+encodeURIComponent(title)).then(function(r){return r.ok?r.json():null}).then(function(x){if(id===S.id&&x&&x.lyrics)setLines(x.lyrics.split("\n").filter(function(z){return z.trim()}),false);else if(id===S.id)$("iLy").textContent=""})
 }).catch(function(){if(id===S.id)$("iLy").textContent=""})}
function loadMeta(t,img){var a=document.querySelectorAll(".art"),j,ar=t.artists?t.artists.map(function(x){return x.name}).join(", "):(t.show?t.show.publisher:""),al=t.album?t.album.name:(t.show?t.show.name:"");
 for(j=0;j<a.length;j++)a[j].style.backgroundImage=img?"url("+img+")":"none";
 var ti=document.querySelectorAll(".title");for(j=0;j<ti.length;j++)ti[j].textContent=t.name;
 var s=document.querySelectorAll("#left .sub");s[0].textContent=al;s[1].textContent=ar;document.querySelector("#idle .sub").textContent=al+" \u00B7 "+ar;
 if(img)paletteFrom(img,setPal)}
function apply(d){var t=d.item;S.playing=!!d.is_playing;document.body.classList.toggle("track-playing",!!(S.playing&&t));S.progress=d.progress_ms||0;S.stamp=Date.now();S.duration=t.duration_ms;S.shuf=!!d.shuffle_state;S.rep=d.repeat_state||"off";
 $("shuf").className="pl"+(S.shuf?" on":"");$("rep").className="pl"+(S.rep!=="off"?" on":"");$("rep").textContent=S.rep==="track"?"חזרה על שיר":(S.rep==="context"?"חזרה על הכול":"חזרה");
 if(d.device&&d.device.volume_percent!=null&&Date.now()>S.volT){$("vol").value=d.device.volume_percent;$("quickVolume").value=d.device.volume_percent;}
 pp();
 if(t.id!==S.id){S.id=t.id;var im=(t.album&&t.album.images)||t.images||[];loadMeta(t,im.length?im[0].url:"");if(t.artists)loadLyrics(t);else setLines([],true)}}
function poll(){var requestedAt=Date.now();api("GET","/me/player").then(function(r){if(r.status===204||r.status===202)return null;return r.ok?r.json():null}).then(function(d){if(d&&d.item){if(d.is_playing&&typeof d.progress_ms==="number")d.progress_ms+=Math.max(0,Date.now()-requestedAt);apply(d)}}).catch(function(e){if(String(e.message)==="no token")showSetup("נדרש חיבור מחדש")}).then(function(){setTimeout(poll,S.playing?3000:8000)})}

/* שליטה */
function put(path,body,after){api("PUT",path,body).then(function(){if(after)setTimeout(after,400)}).catch(function(){})}
$("pp").onclick=function(){S.progress=curMs();S.stamp=Date.now();S.playing=!S.playing;pp();put(S.playing?"/me/player/play":"/me/player/pause")};
$("next").onclick=function(){api("POST","/me/player/next").then(function(){setTimeout(poll,600)})};
$("prev").onclick=function(){api("POST","/me/player/previous").then(function(){setTimeout(poll,600)})};
$("track").onclick=function(e){if(!S.duration)return;var r=$("rail").getBoundingClientRect(),ms=Math.round(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*S.duration);S.progress=ms;S.stamp=Date.now();put("/me/player/seek?position_ms="+ms)};
$("vol").oninput=function(){var v=this.value;S.volT=Date.now()+4000;clearTimeout(S.vt);S.vt=setTimeout(function(){put("/me/player/volume?volume_percent="+v)},200)};
$("quickVolume").oninput=function(){var v=this.value;$("vol").value=v;S.volT=Date.now()+4000;clearTimeout(S.vt);S.vt=setTimeout(function(){put("/me/player/volume?volume_percent="+v)},200)};
$("shuf").onclick=function(){S.shuf=!S.shuf;this.className="pl"+(S.shuf?" on":"");put("/me/player/shuffle?state="+S.shuf)};
$("rep").onclick=function(){S.rep=S.rep==="off"?"context":(S.rep==="context"?"track":"off");put("/me/player/repeat?state="+S.rep,null,poll)};
function loadDevs(){api("GET","/me/player/devices").then(function(r){return r.ok?r.json():null}).then(function(d){if(!d)return;var bx=$("devs");bx.innerHTML="";
 d.devices.forEach(function(v){var b=document.createElement("button");b.className="dev"+(v.is_active?" on":"");b.textContent=v.name;b.onclick=function(){put("/me/player",{device_ids:[v.id],play:S.playing},loadDevs)};bx.appendChild(b)});
 if(!d.devices.length)bx.textContent="אין מכשירים פעילים. פתח את ספוטיפיי באחד מהם."}).catch(function(){})}
document.querySelector('[data-s="sP"]').addEventListener("click",loadDevs);

/* התחברות */
function rand(n){var a=new Uint8Array(n),s="",c="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";crypto.getRandomValues(a);for(var i=0;i<n;i++)s+=c[a[i]%c.length];return s}
function b64(buf){var s="",a=new Uint8Array(buf);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function ovl(){var on=$("night").style.display==="flex"||$("setup").style.display==="flex";document.documentElement.className=on?"ov":""}
function showSetup(msg){$("setup").style.display="flex";ovl();$("ruri").textContent=REDIRECT;$("cid").value=LS.get("cid")||"";$("err").textContent=msg||"";var rt=LS.get("rt"),c=LS.get("cid");if(rt&&c){$("tcode").value=btoa(c+"|"+rt);$("outbox").style.display="block"}else $("outbox").style.display="none"}
function login(){var cid=$("cid").value.replace(/\s/g,"");if(!cid){$("err").textContent="חסר Client ID";return}
 LS.set("cid",cid);var v=rand(64);LS.set("verifier",v);
 crypto.subtle.digest("SHA-256",new TextEncoder().encode(v)).then(function(h){location.href="https://accounts.spotify.com/authorize?response_type=code&client_id="+encodeURIComponent(cid)+"&scope="+encodeURIComponent(SCOPES)+"&redirect_uri="+encodeURIComponent(REDIRECT)+"&code_challenge_method=S256&code_challenge="+b64(h)})}
function tokenReq(p){p.client_id=LS.get("cid");var body=Object.keys(p).map(function(k){return k+"="+encodeURIComponent(p[k])}).join("&");
 return fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:body}).then(function(r){return r.json()}).then(function(d){
  if(!d.access_token)throw new Error(d.error_description||"auth failed");LS.set("at",d.access_token);LS.set("exp",String(Date.now()+d.expires_in*1000-60000));if(d.refresh_token)LS.set("rt",d.refresh_token)})}
function ensureToken(){if(LS.get("at")&&Date.now()<Number(LS.get("exp")||0))return Promise.resolve();if(!LS.get("rt"))return Promise.reject(new Error("no token"));return tokenReq({grant_type:"refresh_token",refresh_token:LS.get("rt")})}
function api(m,path,body){return ensureToken().then(function(){var o={method:m,headers:{Authorization:"Bearer "+LS.get("at")}};if(body){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(body)}return fetch("https://api.spotify.com/v1"+path,o)}).then(function(r){if(r.status===401){LS.del("at");LS.set("exp","0")}return r})}
$("go").onclick=login;$("cfg").onclick=function(){showSetup()};$("closeSetup").onclick=function(){$("setup").style.display="none";ovl()};
$("copy").onclick=function(){var t=$("tcode");t.select();t.setSelectionRange(0,99999);try{document.execCommand("copy");$("copy").textContent="הועתק"}catch(e){}};
$("useCode").onclick=function(){var raw=$("tin").value.replace(/[^A-Za-z0-9+\/=_-]/g,"").replace(/-/g,"+").replace(/_/g,"/");
 try{var d=atob(raw).split("|");if(d.length!==2||!d[0]||!d[1])throw 0;LS.set("cid",d[0]);LS.set("rt",d[1]);LS.del("at");LS.set("exp","0");location.reload()}catch(e){$("err").textContent="הקוד לא תקין (אורך "+raw.length+"). העתק אותו שוב במלואו"}};
document.addEventListener("touchstart",function(){var v=$("nv");if(v.paused)v.play().catch(function(){})},{passive:true});
function start(){pp();setInterval(ui,200);poll();requestWakeLock()}
var qp=new URLSearchParams(location.search);
if(qp.get("code")){var code=qp.get("code");history.replaceState({},"",REDIRECT);tokenReq({grant_type:"authorization_code",code:code,redirect_uri:REDIRECT,code_verifier:LS.get("verifier")||""}).then(start).catch(function(e){showSetup("ההתחברות נכשלה: "+e.message)})}
else if(qp.get("error")){history.replaceState({},"",REDIRECT);showSetup("ספוטיפיי סירבה: "+qp.get("error"))}
else if(LS.get("rt")){start()}else showSetup();
window.onresize=function(){cur=-1;ui()};

/* מצב שינה ידני בלבד — אין מעבר אוטומטי אחרי 30 שניות */
var wakeLock=null;
function requestWakeLock(){if(!("wakeLock" in navigator)||document.visibilityState!=="visible")return;
 navigator.wakeLock.request("screen").then(function(lock){wakeLock=lock;lock.addEventListener("release",function(){if(wakeLock===lock)wakeLock=null})}).catch(function(){});}
function enterSleep(){show("");document.body.classList.add("idle");requestWakeLock()}
function exitSleep(){document.body.classList.remove("idle");if(wakeLock){wakeLock.release().catch(function(){});wakeLock=null}}
$("sleepBtn").addEventListener("click",enterSleep);
$("wakeBtn").addEventListener("click",exitSleep);
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")requestWakeLock()});
document.addEventListener("pointerdown",function(){if(document.visibilityState==="visible")requestWakeLock()},{passive:true});
document.addEventListener("touchstart",function(){if(document.visibilityState==="visible")requestWakeLock()},{passive:true});

/* טאבים */
function show(id){["sT","sL","sP"].forEach(function(s){$(s).className="sheet glass"+(s===id?" show":"")});
 var t=document.querySelectorAll(".tab");for(var i=0;i<t.length;i++)t[i].className="tab"+(t[i].getAttribute("data-s")===id?" on":"")}
var tb=document.querySelectorAll(".tab");for(var i=0;i<tb.length;i++)tb[i].onclick=function(){var s=this.getAttribute("data-s");show(this.className.indexOf("on")>-1&&s?"":s)};

/* משימות */
var tasks=[];try{tasks=JSON.parse(localStorage.getItem("tasks")||"[]")}catch(e){}
function save(){try{localStorage.setItem("tasks",JSON.stringify(tasks))}catch(e){}}
function render(){var l=$("list");l.innerHTML="";tasks.forEach(function(t,i){var d=document.createElement("div");d.className="t"+(t.d?" done":"");
 var s=document.createElement("span");s.textContent=t.x;s.onclick=function(){t.d=!t.d;save();render()};
 var x=document.createElement("b");x.textContent="×";x.onclick=function(){tasks.splice(i,1);save();render()};d.appendChild(s);d.appendChild(x);l.appendChild(d)})}
function addT(){var v=$("inp").value.trim();if(!v)return;tasks.unshift({x:v,d:false});$("inp").value="";save();render()}
$("add").onclick=addT;$("inp").onkeydown=function(e){if(e.keyCode==13)addT()};render();

/* מנורה */
var lamp={on:false,br:50,ct:50};
function sendLamp(){$("pwr").className=lamp.on?"on":"";if(!CONFIG.lampEndpoint)return;try{fetch(CONFIG.lampEndpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(lamp)})}catch(e){}}
$("pwr").onclick=function(){lamp.on=!lamp.on;sendLamp()};$("br").onchange=function(){lamp.br=+this.value;sendLamp()};$("ct").onchange=function(){lamp.ct=+this.value;sendLamp()};
var shT;function armSheet(){clearTimeout(shT);shT=setTimeout(function(){show("")},15000)}
document.addEventListener("touchstart",function(e){var h=document.querySelector(".sheet.show");if(!h)return;if(!h.contains(e.target)&&!$("tabs").contains(e.target))show("");else armSheet()},{passive:true});
$("tabs").addEventListener("click",armSheet);
$("inp").onblur=function(){setTimeout(function(){window.scrollTo(0,0)},60)};
</script>
