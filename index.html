<!DOCTYPE html>
<html lang="he" dir="ltr">
<head>
<meta charset="utf-8">
<title>Music Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--mid:rgba(255,255,255,.6);--acc:#fa586a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif}
.bg{position:fixed;top:-15%;left:-15%;width:130%;height:130%;background-size:cover;background-position:center;opacity:0;-webkit-filter:blur(80px) saturate(1.7) brightness(.6);filter:blur(80px) saturate(1.7) brightness(.6);transition:opacity 1.4s}
#shade{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.45));pointer-events:none}
#pager{position:fixed;top:0;left:0;width:300%;height:100%;display:flex;transition:transform .55s cubic-bezier(.22,1,.36,1);-webkit-transition:-webkit-transform .55s cubic-bezier(.22,1,.36,1)}
section{width:33.3333%;height:100%;padding:5vh 5vw 6vh;position:relative;overflow:hidden;display:flex;flex-direction:column}
#dots{position:fixed;bottom:2vh;left:0;right:0;text-align:center;z-index:3;pointer-events:none}
#dots i{display:inline-block;width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.28);margin:0 5px;transition:background .3s}
#dots i.on{background:#fff}
#stage{flex:1;min-height:0;display:flex;align-items:center}
#left{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;margin-right:5vw;max-width:44vw}
#cover{width:min(40vw,60vh);height:min(40vw,60vh);border-radius:12px;background:#1c1c1e center/cover no-repeat;box-shadow:0 24px 60px rgba(0,0,0,.55);transition:transform .7s cubic-bezier(.22,1,.36,1);-webkit-transition:-webkit-transform .7s cubic-bezier(.22,1,.36,1)}
#cover.paused{transform:scale(.88);-webkit-transform:scale(.88)}
#meta{margin-top:3vh;width:100%}
#title{font-size:clamp(22px,3.3vh,38px);font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#artist{font-size:clamp(17px,2.5vh,28px);color:var(--mid);margin-top:.5vh;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lyrics{flex:1;min-width:0;height:100%;position:relative;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 16%,#000 80%,transparent);mask-image:linear-gradient(transparent,#000 16%,#000 80%,transparent)}
#lines{position:absolute;left:0;right:0;top:0;transition:transform .85s cubic-bezier(.22,1,.36,1);-webkit-transition:-webkit-transform .85s cubic-bezier(.22,1,.36,1)}
.l{--dx:30px;font-size:clamp(26px,5vh,58px);font-weight:700;letter-spacing:-.025em;line-height:1.2;padding:1.3vh 3vw 1.3vh 0;opacity:.3;transform-origin:left center;-webkit-transform-origin:left center;transform:translateX(var(--dx)) scale(.88);-webkit-transform:translateX(var(--dx)) scale(.88);transition:transform .9s cubic-bezier(.22,1,.36,1),opacity .7s;-webkit-transition:-webkit-transform .9s cubic-bezier(.22,1,.36,1),opacity .7s;text-align:start}
.l.rtl{--dx:-30px;transform-origin:right center;-webkit-transform-origin:right center}
.l.past{opacity:.2;transform:translateX(calc(var(--dx) * -.5)) scale(.88);-webkit-transform:translateX(calc(var(--dx) * -.5)) scale(.88)}
.l.on{opacity:1;transform:translateX(0) scale(1);-webkit-transform:translateX(0) scale(1)}
#note{position:absolute;top:50%;left:0;right:0;transform:translateY(-50%);text-align:center;font-size:clamp(18px,2.6vh,30px);font-weight:600;color:rgba(255,255,255,.4)}
#prog{display:flex;align-items:center;margin:1vh 0;font-size:15px;font-weight:500;color:rgba(255,255,255,.55);font-variant-numeric:tabular-nums}
#barw{flex:1;padding:16px 0;margin:0 12px;cursor:pointer;touch-action:pan-y}
#bar{height:6px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden}
#fill{height:100%;width:0;background:#fff;pointer-events:none}
#ctl{display:flex;justify-content:center;align-items:center}
.b{border:0;background:transparent;color:#fff;width:min(15vh,17vw);height:min(15vh,17vw);margin:0 4vw;display:flex;align-items:center;justify-content:center;padding:0;border-radius:50%}
.b:active{opacity:.5;transform:scale(.9)}
.b.big{width:min(20vh,22vw);height:min(20vh,22vw)}
.b svg{width:56%;height:56%;fill:currentColor}.b.big svg{width:64%;height:64%}
#p0{align-items:center;justify-content:center;text-align:center}
#hclock{font-size:24vh;font-weight:200;letter-spacing:-.04em;line-height:1}
#hdate{font-size:3.6vh;color:var(--mid);font-weight:500;margin-top:1vh}
#wx{margin-top:6vh}
#wnow{display:flex;align-items:center;justify-content:center;font-size:7vh}
#wnow .wt{font-weight:300;margin:0 2vw}#wnow .wr{font-size:2.6vh;color:var(--mid)}
#wnext{display:flex;justify-content:center;margin-top:3vh}
#wnext div{margin:0 3vw;display:flex;flex-direction:column;align-items:center;font-size:2.8vh}
#wnext b{font-weight:500;color:var(--mid);font-size:2.2vh}#wnext em{font-style:normal;font-weight:600}
#p2{justify-content:center;max-width:760px;margin:0 auto}
.sec{font-size:2.2vh;color:var(--mid);font-weight:600;margin:3vh 0 1.4vh}
#vol{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:6px;background:rgba(255,255,255,.22);outline:0;margin:2vh 0}
#vol::-webkit-slider-thumb{-webkit-appearance:none;width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.5)}
.row{display:flex}
.pill{flex:1;border:0;border-radius:16px;padding:2.4vh 1vw;margin:0 6px;font-size:2.6vh;font-weight:600;background:rgba(255,255,255,.12);color:#fff}
.pill.on{background:#fff;color:#000}
.dev{display:block;width:100%;text-align:start;border:0;border-radius:16px;padding:2.2vh 3vw;margin:6px 0;font-size:2.6vh;font-weight:600;background:rgba(255,255,255,.1);color:#fff}
.dev.on{background:rgba(255,255,255,.9);color:#000}
.np{display:none;text-align:center;color:var(--mid);font-size:2.6vh}
.nop .pc,.nop .ctrl{display:none}.nop .np{display:block}
#night{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;opacity:0;pointer-events:none;transition:opacity 1.6s;z-index:8;overflow:hidden}
#night.on{opacity:1;pointer-events:auto}
#glow{position:absolute;left:-20%;top:-20%;width:140%;height:140%;background-size:cover;-webkit-filter:blur(90px) saturate(1.6) brightness(.36);filter:blur(90px) saturate(1.6) brightness(.36);animation:drift 40s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(-3%,-2%) scale(1)}to{transform:translate(3%,2%) scale(1.12)}}
#nclock{position:absolute;bottom:8vh;left:0;right:0;text-align:center;font-size:7vh;font-weight:200;color:rgba(255,255,255,.35)}
#cfg{position:fixed;top:8px;right:8px;width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:#fff;opacity:.2;font-size:22px;z-index:5}
#nv{position:fixed;width:2px;height:2px;opacity:.02;pointer-events:none;top:0;left:0}
#setup{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;display:none;align-items:center;justify-content:center;padding:6vw;z-index:20;overflow:auto}
#setup .box{max-width:640px;width:100%}
#setup h1{font-size:30px;margin:0 0 12px}
#setup p{color:var(--mid);line-height:1.6;font-size:18px;margin:8px 0}
#setup code{display:block;background:#1c1c1e;padding:12px;border-radius:10px;color:var(--acc);font-size:16px;word-break:break-all;-webkit-user-select:text;user-select:text;margin:6px 0}
#setup input,#setup textarea{width:100%;font-size:18px;padding:14px;border-radius:12px;border:0;background:#1c1c1e;color:#fff;-webkit-user-select:text;user-select:text;margin:6px 0 12px;word-break:break-all}
#setup textarea{height:90px;font-size:15px;color:var(--acc)}
#setup button{font-size:18px;font-weight:700;padding:14px 26px;border:0;border-radius:12px;background:#2c2c2e;color:#fff;margin-bottom:8px}
#go{background:var(--acc)!important}
#err{color:#ff8a7a;margin:8px 0;overflow-wrap:anywhere}
#setup hr{border:0;border-top:1px solid #2c2c2e;margin:24px 0}
@media (orientation:portrait){
 #stage{flex-direction:column;justify-content:flex-start}
 #left{margin:0 0 3vh;max-width:none;width:100%;align-items:center;text-align:center}
 #cover{width:min(76vw,38vh);height:min(76vw,38vh)}
 #lyrics{width:100%}
 .b{margin:0 3vw;width:min(18vw,12vh);height:min(18vw,12vh)}.b.big{width:min(26vw,16vh);height:min(26vw,16vh)}
 #hclock{font-size:16vw}
}

/* MUSIC 2.0 — expressive ambient light */
#lightstorm{position:fixed;inset:-20%;z-index:0;pointer-events:none;overflow:hidden;opacity:.88;mix-blend-mode:screen;transition:opacity 1.5s}
#lightstorm i{position:absolute;display:block;width:65vw;height:65vw;border-radius:50%;filter:blur(65px);-webkit-filter:blur(65px);opacity:.48;will-change:transform,background}
#lightstorm i:nth-child(1){left:-7%;top:0;background:radial-gradient(circle,#ff3b87 0%,rgba(255,59,135,0) 68%);animation:storm1 17s ease-in-out infinite alternate}
#lightstorm i:nth-child(2){right:-8%;top:5%;background:radial-gradient(circle,#5d5bff 0%,rgba(93,91,255,0) 68%);animation:storm2 21s ease-in-out infinite alternate}
#lightstorm i:nth-child(3){left:20%;bottom:-22%;background:radial-gradient(circle,#00d5ff 0%,rgba(0,213,255,0) 68%);animation:storm3 19s ease-in-out infinite alternate}
#lightstorm i:nth-child(4){right:20%;bottom:-25%;background:radial-gradient(circle,#ff9d35 0%,rgba(255,157,53,0) 68%);animation:storm2 25s ease-in-out infinite alternate-reverse}
#lightstorm i:nth-child(5){left:35%;top:20%;width:45vw;height:45vw;background:radial-gradient(circle,#d63cff 0%,rgba(214,60,255,0) 70%);animation:storm1 13s ease-in-out infinite alternate-reverse}
@keyframes storm1{0%{transform:translate(-7%,5%) scale(.8) rotate(0deg)}100%{transform:translate(23%,17%) scale(1.25) rotate(35deg)}}
@keyframes storm2{0%{transform:translate(9%,-6%) scale(1.15)}100%{transform:translate(-20%,22%) scale(.78)}}
@keyframes storm3{0%{transform:translate(-10%,12%) scale(.8)}100%{transform:translate(18%,-16%) scale(1.3)}}
#shade{z-index:1;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,.03),rgba(0,0,0,.46) 72%),linear-gradient(180deg,rgba(0,0,0,.16),rgba(0,0,0,.38))}
#pager{z-index:2}
#dots{z-index:4}
#cover{border-radius:22px;box-shadow:0 25px 80px rgba(0,0,0,.55),0 0 55px rgba(255,255,255,.07);animation:coverFloat 7s ease-in-out infinite}
#cover.paused{animation-play-state:paused}
@keyframes coverFloat{0%,100%{translate:0 0;filter:saturate(1.04)}50%{translate:0 -7px;filter:saturate(1.24)}}
#meta{position:relative;z-index:2;padding:1.2vh 1.4vw;border-radius:14px;background:linear-gradient(90deg,rgba(0,0,0,.42),rgba(0,0,0,.02));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#title{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.15;max-width:100%;overflow-wrap:anywhere;animation:metaIn .55s cubic-bezier(.2,.8,.2,1)}
#artist{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;line-height:1.2;max-width:100%;animation:metaIn .75s cubic-bezier(.2,.8,.2,1)}
@keyframes metaIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}
#prog{position:relative;z-index:3;margin-top:1.7vh;margin-bottom:1.1vh;gap:2px}
#barw{padding:10px 0;touch-action:none}
#bar{height:5px;background:rgba(255,255,255,.28);overflow:visible}
#fill{border-radius:5px;box-shadow:0 0 12px rgba(255,255,255,.5)}
#ctl{position:relative;z-index:3}
.b{margin:0 3vw;transition:transform .18s ease,opacity .18s ease;filter:drop-shadow(0 4px 18px rgba(0,0,0,.3))}
.b.big{filter:drop-shadow(0 0 22px rgba(255,255,255,.12))}
#p2{z-index:2}
.pill{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08)}
.pill.on{box-shadow:0 0 24px rgba(255,255,255,.18)}
#night{z-index:8;background:#020204;transition:opacity 1.4s}
#night.on{pointer-events:auto}
#glow{opacity:.75;filter:blur(100px) saturate(2.6) brightness(.55);-webkit-filter:blur(100px) saturate(2.6) brightness(.55);animation:nightDrift 18s ease-in-out infinite alternate}
@keyframes nightDrift{0%{transform:translate(-8%,-4%) scale(.9) rotate(0)}100%{transform:translate(8%,6%) scale(1.18) rotate(10deg)}}
#nightcontent{position:absolute;inset:0;display:flex;align-items:center;gap:3vw;padding:5vw}
#nightcover{width:min(20vw,24vh);height:min(20vw,24vh);flex:0 0 auto;border-radius:14px;background:#17171a center/cover no-repeat;opacity:.64;box-shadow:0 0 65px rgba(255,255,255,.08);animation:nightCoverFloat 12s ease-in-out infinite alternate}
@keyframes nightCoverFloat{from{transform:translateY(4px) scale(.96)}to{transform:translateY(-5px) scale(1.02)}}
#nightmeta{min-width:0;flex:1;opacity:.68}
#nighttitle{font-size:clamp(18px,3.1vh,34px);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nightartist{font-size:clamp(14px,2.2vh,22px);color:#aaa;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nclock{position:static;flex:0 0 auto;text-align:right;font-size:clamp(32px,8vh,90px);font-weight:200;letter-spacing:-.04em;color:rgba(255,255,255,.42);min-width:2.7em}
#toast{position:fixed;left:50%;bottom:6vh;transform:translate(-50%,15px);opacity:0;z-index:30;max-width:85vw;padding:12px 18px;border-radius:14px;background:rgba(25,25,28,.92);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:15px;text-align:center;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0)}
body.playing #lightstorm{opacity:1}
body:not(.playing) #lightstorm{opacity:.58}
@media (prefers-reduced-motion:reduce){#lightstorm i,#cover,#nightcover,#glow{animation:none!important}}
@media (orientation:portrait){
 #nightcontent{flex-direction:column;justify-content:center;text-align:center;padding:8vw;gap:2vh}
 #nightcover{width:min(32vw,20vh);height:min(32vw,20vh)}
 #nightmeta{flex:0 1 auto;width:100%}
 #nclock{text-align:center}
 #meta{padding:1vh 2vw}
 #title{font-size:clamp(20px,3vh,30px)}
 #artist{font-size:clamp(16px,2.2vh,22px)}
 #lightstorm i{width:95vw;height:95vw;filter:blur(50px);-webkit-filter:blur(50px)}
}


/* FUTURE LISTENING ROOM — premium sci-fi interface pass */
:root{--mid:rgba(237,239,255,.72);--acc:#a78bfa;--glass:rgba(10,10,24,.52);--edge:rgba(185,164,255,.28)}
body{background:#03030a}
.bg{opacity:.18!important;-webkit-filter:blur(70px) saturate(2.15) brightness(.7)!important;filter:blur(70px) saturate(2.15) brightness(.7)!important}
#lightstorm{opacity:.96;mix-blend-mode:screen}
#lightstorm i{opacity:.58;filter:blur(58px);-webkit-filter:blur(58px)}
#shade{z-index:1;background:radial-gradient(ellipse at 35% 42%,rgba(10,6,35,.04),rgba(2,2,10,.44) 72%),linear-gradient(90deg,rgba(4,3,13,.62),rgba(4,3,13,.08) 46%,rgba(4,3,13,.35));pointer-events:none}
#pager{z-index:2}
section{padding:4vh 3.4vw 5vh}
#p1{isolation:isolate}
#p1:before{content:"";position:absolute;inset:2.2vh 1.6vw 4vh;border:1px solid rgba(177,151,255,.23);border-radius:26px;background:linear-gradient(135deg,rgba(12,10,32,.42),rgba(4,5,17,.2) 55%,rgba(29,8,42,.22));box-shadow:inset 0 0 35px rgba(138,94,255,.05),0 0 40px rgba(89,61,255,.08);pointer-events:none;z-index:-1}
#stage{gap:2.4vw;align-items:center;padding:2vh 1.6vw 1vh}
#left{display:flex;flex-direction:row;align-items:center;gap:2vw;margin-right:0;max-width:57%;width:57%;min-width:0}
#cover{flex:0 0 auto;width:min(26vw,42vh);height:min(26vw,42vh);border-radius:18px;border:1px solid rgba(255,255,255,.26);box-shadow:0 22px 75px rgba(0,0,0,.58),0 0 38px rgba(139,92,246,.28),0 0 0 5px rgba(255,255,255,.025);background-color:#11101c;position:relative}
#meta{margin:0;min-width:0;flex:1;width:auto;padding:1.3vh 1.2vw;border:1px solid rgba(203,190,255,.14);border-radius:18px;background:linear-gradient(135deg,rgba(255,255,255,.085),rgba(255,255,255,.025));box-shadow:inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
#title{font-size:clamp(22px,3.3vh,42px);line-height:1.14;font-weight:750;letter-spacing:-.035em;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;animation:metaIn .55s cubic-bezier(.2,.8,.2,1)}
#artist{font-size:clamp(17px,2.4vh,29px);line-height:1.25;color:rgba(248,246,255,.82);margin-top:1.15vh;font-weight:500;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;word-break:normal;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;animation:metaIn .72s cubic-bezier(.2,.8,.2,1)}
#lyrics{height:100%;min-width:0;flex:1;padding:1.5vh 1.2vw;border:1px solid rgba(190,167,255,.22);border-radius:20px;background:linear-gradient(160deg,rgba(11,10,29,.66),rgba(7,8,20,.34));box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 12px 45px rgba(0,0,0,.14);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.l{font-size:clamp(21px,3.5vh,44px);line-height:1.23;padding:1.1vh .5vw;overflow-wrap:anywhere;text-shadow:0 0 20px rgba(183,148,255,.12)}
.l.on{color:#fff;text-shadow:0 0 24px rgba(186,145,255,.32)}
#prog{position:relative;z-index:3;margin:1.5vh 2vw 1vh;padding:0 1vw;font-size:clamp(12px,1.7vh,17px);gap:1vw}
#barw{padding:18px 0;margin:0 1vw}
#bar{height:5px;background:rgba(255,255,255,.22);box-shadow:0 0 0 1px rgba(255,255,255,.035)}
#fill{background:linear-gradient(90deg,#62e7ff,#a78bfa 50%,#ff72cb);box-shadow:0 0 14px rgba(167,139,250,.75)}
#ctl{position:relative;z-index:3;gap:1vw}
.b{margin:0 2vw;border:1px solid rgba(255,255,255,.1);background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.015));box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 8px 24px rgba(0,0,0,.22);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .18s ease,background .2s,box-shadow .2s}
.b.big{border:1px solid rgba(194,168,255,.75);background:radial-gradient(circle at 35% 20%,rgba(195,169,255,.28),rgba(99,65,210,.13) 58%,rgba(255,255,255,.035));box-shadow:0 0 0 5px rgba(158,120,255,.06),0 0 35px rgba(139,92,246,.32),inset 0 1px 0 rgba(255,255,255,.25)}
.b:active{transform:scale(.91);box-shadow:0 0 30px rgba(167,139,250,.45)}
#p0{isolation:isolate}
#p0:before,#p2:before{content:"";position:absolute;inset:2.2vh 1.6vw 4vh;border:1px solid rgba(177,151,255,.23);border-radius:26px;background:linear-gradient(135deg,rgba(12,10,32,.42),rgba(4,5,17,.2) 55%,rgba(29,8,42,.22));pointer-events:none;z-index:-1}
#hclock{font-size:clamp(100px,22vh,240px);font-weight:200;text-shadow:0 0 50px rgba(167,139,250,.22);letter-spacing:-.065em}
#hdate{font-size:clamp(20px,3.3vh,36px)}
#wx{padding:2vh 3vw;border:1px solid var(--edge);border-radius:22px;background:rgba(9,8,24,.48);box-shadow:0 0 45px rgba(89,61,255,.12);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
#p2{isolation:isolate;padding-left:8vw;padding-right:8vw}
#p2 .pc{width:100%;max-width:780px;padding:3vh 3vw;border:1px solid var(--edge);border-radius:26px;background:linear-gradient(145deg,rgba(15,12,36,.72),rgba(5,6,18,.54));box-shadow:0 20px 70px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.sec{font-size:clamp(17px,2.3vh,24px);letter-spacing:.02em;color:rgba(234,226,255,.78)}

   for(var j=0;j<k.length;j++)k[j].className='l'+(k[j].rtl?' rtl':'')+(j===idx?' on':(j<idx?' past':''));
   S.active=idx;
   if(idx>=0&&k[idx]){var el=k[idx],h=$('lyrics').clientHeight,y=h*.36-el.offsetTop-el.offsetHeight/2;$('lines').style.transform='translateY('+y+'px)';$('lines').style.webkitTransform='translateY('+y+'px)'}
  }
 }
 var m=pad(now.getHours())+':'+pad(now.getMinutes());
 if(m!==S.lastMin){S.lastMin=m;$('hclock').textContent=m;$('nclock').textContent=m;
  try{$('hdate').textContent=now.toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'})}catch(e){}}
 var h2=now.getHours(),night=NIGHT_FROM>NIGHT_TO?(h2>=NIGHT_FROM||h2<NIGHT_TO):(h2>=NIGHT_FROM&&h2<NIGHT_TO);
 var on=night&&Date.now()>S.awake;if(($('night').className==='on')!==on)$('night').className=on?'on':'';
 if(!S.playing&&S.page===1&&Date.now()-S.lastPlay>90000)go(0);
}

/* Petah Tikva weather */
function wi(c){return c===0?'\u2600\uFE0F':c<=2?'\uD83C\uDF24':c===3?'\u2601\uFE0F':c<=48?'\uD83C\uDF2B':c<=67?'\uD83C\uDF27':c<=77?'\u2744\uFE0F':c<=82?'\uD83C\uDF26':'\u26C8'}
function weather(){
 fetch(WX).then(function(r){if(!r.ok)throw new Error('weather');return r.json()}).then(function(d){
  var c=d.current,h=d.hourly,i=h.time.indexOf(c.time.slice(0,13)+':00');if(i<0)i=0;
  $('wnow').innerHTML='<span>'+wi(c.weather_code)+'</span><span class="wt">'+Math.round(c.temperature_2m)+'\u00B0</span><span class="wr">\u2191'+Math.round(d.daily.temperature_2m_max[0])+'\u00B0 \u2193'+Math.round(d.daily.temperature_2m_min[0])+'\u00B0</span>';
  $('wnext').innerHTML=[3,6,9,12].map(function(k){var j=i+k;if(j>=h.time.length)return '';return '<div><b>'+h.time[j].slice(11,13)+':00</b><span>'+wi(h.weather_code[j])+'</span><em>'+Math.round(h.temperature_2m[j])+'\u00B0</em></div>'}).join('');
 }).catch(function(){ $('wnow').textContent='תחזית מזג האוויר לא זמינה';});
}

/* Devices and controls */
function loadDevs(){
 api('GET','/me/player/devices').then(function(r){return r.json()}).then(function(d){
  var box=$('devs');box.innerHTML='';
  (d.devices||[]).forEach(function(v){var b=document.createElement('button');b.className='dev'+(v.is_active?' on':'');b.textContent=v.name;
   b.onclick=function(){put('/me/player',{device_ids:[v.id],play:S.playing},loadDevs)};box.appendChild(b)});
  if(!d.devices||!d.devices.length)box.innerHTML='<div class="np" style="display:block">אין מכשירים זמינים כרגע. פתח את Spotify במכשיר הרצוי.</div>';
 }).catch(function(){ $('devs').textContent='לא הצלחתי לטעון מכשירים';});
}
$('pp').onclick=function(){
 var was=S.playing;S.progress=currentMs();S.stamp=Date.now();S.playing=!was;setPlayIcon();
 put(S.playing?'/me/player/play':'/me/player/pause',null,poll);
};
$('next').onclick=function(){toast('מדלג לשיר הבא…');put('/me/player/next',null,poll,'POST')};
$('prev').onclick=function(){toast('חוזר לשיר הקודם…');put('/me/player/previous',null,poll,'POST')};
function seekAt(clientX){
 if(!S.duration)return;var r=$('bar').getBoundingClientRect(),p=Math.max(0,Math.min(1,(clientX-r.left)/r.width)),ms=Math.round(p*S.duration);
 S.progress=ms;S.stamp=Date.now();$('fill').style.width=(p*100)+'%';$('tc').textContent=fmt(ms);$('tr').textContent='-'+fmt(S.duration-ms);
 put('/me/player/seek?position_ms='+ms,null,poll);
}
$('barw').addEventListener('click',function(e){seekAt(e.clientX)});
$('barw').addEventListener('touchend',function(e){if(e.changedTouches&&e.changedTouches.length)seekAt(e.changedTouches[0].clientX)},{passive:true});
$('vol').oninput=function(){var v=this.value;S.volT=Date.now()+4000;clearTimeout(S.vt);S.vt=setTimeout(function(){put('/me/player/volume?volume_percent='+v+(S.deviceId?'&device_id='+encodeURIComponent(S.deviceId):''))},250)};
$('shuf').onclick=function(){S.shuf=!S.shuf;this.className='pill'+(S.shuf?' on':'');put('/me/player/shuffle?state='+S.shuf+(S.deviceId?'&device_id='+encodeURIComponent(S.deviceId):''),null,poll)};
$('rep').onclick=function(){S.rep=S.rep==='off'?'context':(S.rep==='context'?'track':'off');this.className='pill'+(S.rep!=='off'?' on':'');this.textContent=S.rep==='track'?'חזרה על שיר':(S.rep==='context'?'חזרה על הכול':'חזרה');put('/me/player/repeat?state='+S.rep+(S.deviceId?'&device_id='+encodeURIComponent(S.deviceId):''),null,poll)};

/* Setup and transfer code */
$('go').onclick=login;
$('cfg').onclick=function(){showSetup()};
$('closeSetup').onclick=function(){$('setup').style.display='none'};
$('copy').onclick=function(){var t=$('tcode');t.select();t.setSelectionRange(0,99999);try{document.execCommand('copy');$('copy').textContent='הועתק'}catch(e){$('copy').textContent='סמן והעתק ידנית'}};
$('useCode').onclick=function(){
 var raw=$('tin').value.trim().replace(/\s/g,'').replace(/-/g,'+').replace(/_/g,'/');
 while(raw.length%4)raw+='=';
 try{var d=atob(raw).split('|');if(d.length!==2||!d[0]||!d[1])throw 0;
  LS.set('cid',d[0]);LS.set('rt',d[1]);LS.del('at');LS.set('exp','0');location.reload();
 }catch(e){$('err').textContent='הקוד לא תקין. העתק אותו שוב במלואו, בלי רווחים'}
};

/* Start */
function start(){setInterval(tick,200);tick();poll();weather();setInterval(weather,900000);go(1)}
var p=new URLSearchParams(location.search);
if(p.get('code')){
 var code=p.get('code');history.replaceState({},'',REDIRECT);
 tokenReq({grant_type:'authorization_code',code:code,redirect_uri:REDIRECT,code_verifier:LS.get('verifier')||''}).then(start).catch(function(e){showSetup('ההתחברות נכשלה: '+e.message)});
}else if(p.get('error')){history.replaceState({},'',REDIRECT);showSetup('ספוטיפיי סירבה: '+p.get('error'))}
else if(LS.get('rt')){start()}else showSetup();
})();
</script>
